# Publishes @ronana/mcp to npm when a GitHub release is published, with npm
# provenance: npm records that this workflow, at this commit, built the package.
#
# Authentication is npm trusted publishing (OIDC): no npm token is stored in
# this repository. The trusted publisher is configured on npmjs.com for
# ronana-ai/cli and this workflow file.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.21.1
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm publish --provenance --access public
